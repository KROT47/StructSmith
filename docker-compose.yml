services:
  structsmith:
    build: .
    image: ghcr.io/dziksu/structsmith:latest
    ports:
      - "127.0.0.1:8090:8080"
    volumes:
      - structsmith-data:/data
    environment:
      PORT: 8080
      AUTH_MODE: none
      MCP_READ_ONLY: "false"
    restart: unless-stopped

volumes:
  structsmith-data:
